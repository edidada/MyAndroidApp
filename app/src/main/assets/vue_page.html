<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue + vConsole</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vconsole@3.15.1/dist/vconsole.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .counter-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .counter {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            text-align: center;
            margin: 16px 0;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 16px;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5a6fd6;
        }
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #d0d0d0;
        }
        .input-group {
            margin: 20px 0;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 8px 0;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .list-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f0f0f0;
            margin: 8px 0;
            border-radius: 8px;
        }
        .list-item span {
            flex: 1;
        }
        .list-item button {
            background: #ff4757;
            color: white;
            padding: 6px 12px;
            font-size: 14px;
        }
        .status {
            text-align: center;
            padding: 12px;
            background: #d4edda;
            color: #155724;
            border-radius: 8px;
            margin-top: 16px 0;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <h1>🎬 视频编辑器 - Vue 页面</h1>
            
            <div class="counter-box">
                <h3>计数器</h3>
                <div class="counter">{{ count }}</div>
                <div class="btn-group">
                    <button class="btn-primary" @click="increment">+1</button>
                    <button class="btn-secondary" @click="decrement">-1</button>
                    <button class="btn-primary" @click="reset">重置</button>
                </div>
            </div>
            </div>

            <div class="input-group">
                <h3>任务列表</h3>
                <input v-model="newTodo" placeholder="输入新任务..." @keyup.enter="addTodo">
                <div class="btn-group">
                    <button class="btn-primary" @click="addTodo">添加</button>
                    <button class="btn-secondary" @click="clearTodos">清空</button>
                </div>
                <div v-if="todos.length" class="status">{{ todos.length }} 个任务</div>
                <div v-for="(todo, index) in todos" :key="index" class="list-item">
                    <span>{{ todo }}</span>
                    <button @click="removeTodo(index)">删除</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化 vConsole
        const vConsole = new VConsole({
            theme: 'dark',
            onReady: function() {
                console.log('vConsole 已初始化完成');
            }
        });

        const { createApp, ref } = Vue;
        createApp({
            setup() {
                const count = ref(0);
                const newTodo = ref('');
                const todos = ref(['开发视频编辑器', '添加 Vue 页面', '集成 vConsole', '测试功能']);

                const increment = () => {
                    count.value++;
                    console.log('计数器增加:', count.value);
                };
                const decrement = () => {
                    count.value--;
                    console.log('计数器减少:', count.value);
                };
                const reset = () => {
                    count.value = 0;
                    console.log('计数器重置');
                };

                const addTodo = () => {
                    if (newTodo.value.trim()) {
                        todos.value.push(newTodo.value);
                        console.log('添加任务:', newTodo.value);
                        newTodo.value = '';
                    }
                };
                const removeTodo = (index) => {
                    const removed = todos.value.splice(index, 1)[0];
                    console.log('删除任务:', removed);
                };
                const clearTodos = () => {
                    const count = todos.value.length;
                    todos.value = [];
                    console.log('清空任务:', count, '个');
                };

                return {
                    count,
                    newTodo,
                    todos,
                    increment,
                    decrement,
                    reset,
                    addTodo,
                    removeTodo,
                    clearTodos
                };
            }
        }).mount('#app');

        console.log('Vue 应用已加载！');
        console.log('点击右下角绿色按钮打开 vConsole');
    </script>
</body>
</html>
