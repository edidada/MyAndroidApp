plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.myapplication'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.myapplication"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    flavorDimensions "env"
    productFlavors {
        dev {
            dimension "env"
            buildConfigField "String", "ENV", "\"dev\""
            buildConfigField "String", "API_HOST", "\"https://dev-api.xxx.com\""
            resValue "string", "env_name", "dev"
            resValue "string", "api_host", "https://dev-api.xxx.com"
        }
        sit {
            dimension "env"
            buildConfigField "String", "ENV", "\"sit\""
            buildConfigField "String", "API_HOST", "\"https://sit-api.xxx.com\""
            resValue "string", "env_name", "sit"
            resValue "string", "api_host", "https://sit-api.xxx.com"
        }
        uat {
            dimension "env"
            buildConfigField "String", "ENV", "\"uat\""
            buildConfigField "String", "API_HOST", "\"https://uat-api.xxx.com\""
            resValue "string", "env_name", "uat"
            resValue "string", "api_host", "https://uat-api.xxx.com"
        }
        prod {
            dimension "env"
            buildConfigField "String", "ENV", "\"prod\""
            buildConfigField "String", "API_HOST", "\"https://api.xxx.com\""
            resValue "string", "env_name", "prod"
            resValue "string", "api_host", "https://api.xxx.com"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        jniLibs {
            // matrix-backtrace 与 ffmpeg-kit 各自带一份 libc++_shared.so（同路径同 ABI），
            // mergeNativeLibs 会直接报 "2 files found with path"。这里让合并器取其一而不是失败。
            pickFirsts.add('**/libc++_shared.so')
        }
    }

    sourceSets {
        // GodEyeDashboard 的 release 空实现放在 src/releaseStub/java：根 .gitignore 第 27 行有
        // `release/`，src/release/java 不会被 git 跟踪，所以手工挂一个不被忽略的目录进来。
        // 真实现在 src/debug/java（依赖是 debugImplementation，release 变体里根本没有这些类）。
        release.java.srcDirs += 'src/releaseStub/java'
    }
}

dependencies {
    implementation project(':dao')
    implementation project(':utils')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation libs.appcompat
    implementation libs.material
    debugImplementation 'io.github.didi.dokit:dokitx:3.5.0'
    releaseImplementation 'io.github.didi.dokit:dokitx-no-op:3.5.0'
    implementation 'com.arthenica:ffmpeg-kit-full:6.0-2'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // --- Tencent Matrix APM (免插桩子集：AGP 9 上无法使用 matrix-gradle-plugin) ---
    implementation libs.matrix.android.lib
    implementation libs.matrix.android.commons
    implementation libs.matrix.trace.canary
    implementation libs.matrix.io.canary
    implementation libs.matrix.memory.canary
    implementation libs.matrix.battery.canary
    implementation libs.matrix.resource.canary.android
    implementation libs.matrix.resource.canary.common
    implementation libs.matrix.resource.canary.analyzer

    // --- Perfetto 标记 + 掉帧统计（替代已停更且 jitpack 不可达的 AndroidGodEye）---
    implementation libs.tracing
    implementation libs.metrics.performance

    // --- 内存泄漏引用链：debug 专用，避免与 Matrix ResourceCanary 抢 heap dump ---
    debugImplementation libs.leakcanary

    // --- AndroidGodEye 实时看板（FPS/CPU/内存/电量/线程/启动/页面）：只在 debug 变体进包 ---
    // godeye-* 是 2020 年的库，transitively 带 com.android.support:*:28.0.0（AndroidX 之前的同名类），
    // 与 androidx.core / versionedparcelable 直接撞类，必须整组排除。
    debugImplementation(libs.godeye.core) {
        exclude group: 'com.android.support'
    }
    debugImplementation(libs.godeye.monitor) {
        exclude group: 'com.android.support'
    }
}
