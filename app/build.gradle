apply plugin: 'com.android.application'

def dokitPluginEnabled = (findProperty("DOKIT_PLUGIN_SWITCH") ?: "false").toString().toBoolean()
if (dokitPluginEnabled) {
    apply plugin: 'com.didi.dokit'
}

android {
    namespace 'com.example.myapplication'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.myapplication"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    flavorDimensions "env"
    productFlavors {
        dev {
            dimension "env"
            buildConfigField "String", "ENV", "\"dev\""
            buildConfigField "String", "API_HOST", "\"https://dev-api.xxx.com\""
            resValue "string", "env_name", "dev"
            resValue "string", "api_host", "https://dev-api.xxx.com"
        }
        sit {
            dimension "env"
            buildConfigField "String", "ENV", "\"sit\""
            buildConfigField "String", "API_HOST", "\"https://sit-api.xxx.com\""
            resValue "string", "env_name", "sit"
            resValue "string", "api_host", "https://sit-api.xxx.com"
        }
        uat {
            dimension "env"
            buildConfigField "String", "ENV", "\"uat\""
            buildConfigField "String", "API_HOST", "\"https://uat-api.xxx.com\""
            resValue "string", "env_name", "uat"
            resValue "string", "api_host", "https://uat-api.xxx.com"
        }
        prod {
            dimension "env"
            buildConfigField "String", "ENV", "\"prod\""
            buildConfigField "String", "API_HOST", "\"https://api.xxx.com\""
            resValue "string", "env_name", "prod"
            resValue "string", "api_host", "https://api.xxx.com"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

if (dokitPluginEnabled) {
    dokitExt {
        comm {
            gpsSwitch true
            networkSwitch true
            bigImgSwitch true
            webViewSwitch true
        }
    }
}

dependencies {
    implementation project(':dao')
    implementation project(':utils')
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation libs.appcompat
    implementation libs.material
    debugImplementation 'io.github.didi.dokit:dokitx:3.5.0'
    releaseImplementation 'io.github.didi.dokit:dokitx-no-op:3.5.0'
    implementation 'com.arthenica:ffmpeg-kit-full:6.0-2'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
